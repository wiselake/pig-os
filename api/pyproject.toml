[project]
name = "pigos-api"
version = "0.1.0"
description = "PigOS — Global Swine Farm Management API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "arq>=0.26",
    "email-validator>=2.0",
    "tzdata>=2026.2",
    "boto3>=1.43.39",
    # /legal/privacy 가 정본 마크다운(표 포함)을 렌더링한다. 법무 문서라
    # 직접 파서를 쓰지 않고 검증된 라이브러리를 쓴다 — 표가 깨지면 고지가 깨진다.
    "markdown>=3.7",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Style/modernization rules that conflict with the existing hand-formatted style.
# Real-bug rules (F-codes) stay enabled.
ignore = ["E501", "E701", "E702", "UP042", "UP046", "E741"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "real_publication_set: 게시 문서 manifest 를 실제 상태(현재 전부 DRAFT)로 둔다 — G-3 게이트 검증용",
    "real_rate_limit: 운영 rate limit 기본값을 그대로 쓴다 (기본은 비활성 — integration/conftest.py)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/models/*", "app/schemas/*"]
