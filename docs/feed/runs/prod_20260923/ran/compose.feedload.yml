# One-off feed initial-load runner (2026-09-23). Extends the api service for its environment and network only;
# uses the approved image pigos-feedload:854765a. Never started by `up`; only `compose run --rm --no-deps feedload`.
services:
  feedload:
    extends:
      file: /home/ubuntu/pigos/docker-compose.prod.yml
      service: api
    image: pigos-feedload:854765a
    container_name: pigos-feedload-oneoff
    build: !reset null
    restart: "no"
    depends_on: !reset []
    expose: !reset []
    healthcheck:
      disable: true
    profiles: ["oneoff"]
    volumes:
      - /var/tmp/feed:/var/tmp/feed
    command: ["true"]
