name: CI

on:
  pull_request:
    branches: [development]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest tests/unit -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ★ 정확히 핀한다. "22" 로 두면 로컬(.nvmrc 고정)과 CI(부동)가 갈라진다 —
          #   실제로 그 드리프트 때문에 로컬에서 npm ci 가 notsup 으로 죽었다.
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      # ★ 2026-08-28 신설. 그 전까지 프론트 테스트는 **어디서도 실행되지 않았다** —
      #   CI 에는 스텝이 없었고, 개발 머신은 Node 20.11 이라 vitest 가 뜨지 않았다
      #   (rolldown 이 node:util.styleText 를 import. 20.12+ 필요).
      #   테스트는 있는데 아무도 돌리지 않는 상태였다.
      - name: Unit tests
        run: npm run test:run
      - name: Build
        run: npm run build

# Production deploy is manual only (no auto-deploy on merge).
